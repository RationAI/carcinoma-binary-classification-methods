# @package _global_

carcinoma_roi_t: ${train_data.thresholds.epithelium_roi_t} # for breast, we use weak epithelium annotations

datamodule:
  train:
    train_pos_tissue_roi_t: ${train_data.thresholds.train_pos_tissue_roi_t} # in positive slides, stricter tile selection
    num_slides: 400 # cannot sample from bigger data (torch limitation)
  val:
    train_pos_tissue_roi_t: ${val_data.thresholds.train_pos_tissue_roi_t}
    num_slides: 100

trainer:
  enable_checkpointing: True
  val_check_interval: 0.05 # much more tiles per slide - validate more often
