# @package _global_

defaults:
  - /experiment/train/images/base
  - /datamodule/transforms/normalize_w_stain_augments@transforms
  - /model/resnet50_model@model
  - _self_

model_name: "ResNet50 Stain (224x224)"

datamodule:
  train:
    uris:
      - ${train_data.tiles_filtered_uri_224}
    paths:
      - ${oc.select:train_data.tiles_filtered_path_224, null}
  val:
    uris:
      - ${val_data.tiles_filtered_uri_224}
    paths:
      - ${oc.select:val_data.tiles_filtered_path_224, null}
