# @package _global_

defaults:
  - /experiment/train/images/base
  - /datamodule/transforms/normalize_w_stain_augments@transforms
  - /model/vgg16_model@model
  - _self_

model_name: "VGG-16 Stain"

datamodule:
  train:
    uris:
      - ${train_data.tiles_filtered_uri_512}
    paths:
      - ${oc.select:train_data.tiles_filtered_path_512, null}
  val:
    uris:
      - ${val_data.tiles_filtered_uri_512}
    paths:
      - ${oc.select:val_data.tiles_filtered_path_512, null}
