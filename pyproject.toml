[project]
name = "carcinoma-binary-classification-methods"
version = "0.1.0"
description = "A project for carcinoma detection in digital pathology slides of various tissues."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }

authors = [
    { name = "Jozef Kraus", email = "jozefkraus@mail.muni.cz" },
    { name = "Adam Džadoň", email = "524839@mail.muni.cz" },
    { name = "Vít Musil", email = "vit.musil@mail.muni.cz" },
    { name = "Michal Jakubík", email = "jakubik@mail.muni.cz" },
    { name = "Matej Gallo", email = "gallo.matej@mail.muni.cz" },
]

dependencies = [
    "lightning==2.6.0",
    "albumentations==2.0.8",
    "pandas==2.3.3",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "triton==3.7.1",
    "tqdm==4.67.1",
    "rationai-masks @ git+https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/masks.git@a1bfa348b525133f15dc57418cccdb2d08dc1f0d",
    "rationai-mlkit @ git+https://github.com/RationAI/mlkit.git@db38501bb363cd3d76c6a3d31bec702f16002dd1",
    "rationai-tiling @ git+https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/tiling.git@475e7938e9a7230b378fca1c67106eda84f69c85",
    "rationai-staining @ git+https://gitlab.ics.muni.cz/rationai/digital-pathology/libraries/staining.git@2437ec9af319731f3e32aa79c4bf9e6fef5a5711",
    "rationai-sdk @git+https://github.com/RationAI/rationai-sdk-python.git@5c508500ea7348d52e7914e3ef36846670672c9d",
    "numpy==2.5.1",
    "timm==1.0.15",
    "matplotlib==3.10.1",
    "scikit-learn==1.8.0",
    "openpyxl==3.1.5",
    "mlflow==3.12.0",
    "deprecated==1.3.1",
    "pillow==11.3.0",
    "huggingface_hub==1.26.0",
    "ratiopath==1.4.0",
    "regex==2026.7.19",
    "transformers==5.7.0", # ViT parameter names change later
    "ray[data]==2.56.1",
    "ipykernel==7.3.0",
    "datasets==5.0.1",
]

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "ruff==0.16.1",
    "pre-commit==4.6.1",
]
